<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廠商回報進度</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C8A44A;--gold-d:#9A7830;--gold-l:#E8C870;--gold-pale:#FFFBEE;
  --ink:#28241C;--g700:#4A4540;--g500:#706860;--g400:#A0998E;--g200:#E8E6DF;--g100:#F4F3EF;--g50:#FAFAF8;
  --ok:#1E7A58;--ok-bg:#EDFAF4;--ok-bd:#98DEC0;
  --bad:#B33A2E;--bad-bg:#FBEAE8;
  --w:#fff;--r:16px;--rs:11px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans TC',sans-serif;background:var(--g50);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.6;padding-bottom:40px;
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

.top{background:linear-gradient(150deg,var(--ink),#3A342A);color:#fff;padding:28px 0 34px;position:relative;overflow:hidden}
.top::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:26px 26px;mask-image:radial-gradient(ellipse 70% 90% at 80% 10%,#000,transparent);-webkit-mask-image:radial-gradient(ellipse 70% 90% at 80% 10%,#000,transparent)}
.top .wrap{position:relative;z-index:2}
.brand{font-size:.78rem;letter-spacing:.16em;color:var(--gold-l);font-weight:700;margin-bottom:14px}
.pj-name{font-size:1.5rem;font-weight:900;margin-bottom:6px}
.pj-meta{font-size:.85rem;color:rgba(255,255,255,.7)}

.card{background:var(--w);border:1px solid var(--g200);border-radius:var(--r);padding:20px;margin-top:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card-t{font-size:.72rem;font-weight:900;letter-spacing:.1em;color:var(--g400);margin-bottom:14px;text-transform:uppercase}

.field{margin-bottom:16px}
.fl{display:block;font-size:.8rem;font-weight:800;color:var(--g700);margin-bottom:7px}
.fi{width:100%;padding:12px 14px;border:1.5px solid var(--g200);border-radius:var(--rs);font-size:.92rem;font-family:inherit;background:var(--w)}
.fi:focus{outline:none;border-color:var(--gold)}
textarea.fi{resize:vertical;min-height:70px}

.upz{border:2.5px dashed var(--gold-l);border-radius:var(--r);padding:28px 20px;text-align:center;background:var(--gold-pale);cursor:pointer;margin-bottom:14px}
.upz .ic{font-size:2.2rem;margin-bottom:8px}
.upz .t{font-weight:800;font-size:.92rem;color:var(--ink)}
.upz .s{font-size:.78rem;color:var(--g500);margin-top:4px}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-bottom:14px}
.pgrid .ph{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--g100);border:1.5px solid var(--g200)}
.pgrid .ph img{width:100%;height:100%;object-fit:cover}
.pgrid .del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;font-size:.7rem;cursor:pointer}
.pgrid .add{aspect-ratio:1/1;border:2px dashed var(--g300);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--g400);cursor:pointer}

.btn-main{width:100%;padding:15px;background:linear-gradient(155deg,var(--gold-l),var(--gold));color:var(--ink);border:none;border-radius:var(--rs);font-size:.95rem;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 8px 20px rgba(200,164,74,.35)}
.btn-main:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

.state{text-align:center;padding:70px 20px}
.state .ico{font-size:3rem;margin-bottom:16px}
.state h2{font-size:1.2rem;margin-bottom:8px}
.state p{color:var(--g400);font-size:.92rem}
.spinner{width:36px;height:36px;border:3px solid var(--g200);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:30px;font-size:.85rem;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:999;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.foot{text-align:center;margin-top:28px;font-size:.75rem;color:var(--g400)}
</style>
</head>
<body>

<div id="app">
  <div class="state"><div class="spinner"></div><p style="color:var(--g400)">載入案場資料中…</p></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
const FIREBASE_CONFIG={
  apiKey:"AIzaSyCOvRcTbj0z9cPMOYxicnqbzHLsUP-jOHg",
  authDomain:"zeju-62388.firebaseapp.com",
  databaseURL:"https://zeju-62388-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"zeju-62388",
  storageBucket:"zeju-62388.firebasestorage.app",
  messagingSenderId:"424082469080",
  appId:"1:424082469080:web:247e960d4b604b7c11a7ad"
};

const CATS=['系統櫃','廚具','玻璃','鋁窗','水電','泥作','油漆','鐵件','其他'];

function esc(s){return(s===null||s===undefined?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function getToken(){return new URLSearchParams(location.search).get('c')||'';}
function toArr(v){if(!v)return[];if(Array.isArray(v))return v.filter(x=>x);return Object.values(v).filter(x=>x);}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

function showError(title,msg){
  document.getElementById('app').innerHTML=
    '<div class="state"><div class="ico">⚠️</div><h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p></div>';
}

// 壓縮照片再存，不然檔案太大、上傳慢、資料庫也占空間
function compressImage(file,maxDim,quality){
  return new Promise(res=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onload=e=>{
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h&&w>maxDim){h=h*maxDim/w;w=maxDim;}
        else if(h>maxDim){w=w*maxDim/h;h=maxDim;}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        res(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>res(null);
      img.src=e.target.result;
    };
    reader.onerror=()=>res(null);
    reader.readAsDataURL(file);
  });
}

let db=null, project=null, photos=[];

async function load(){
  const token=getToken();
  if(!token){return showError('連結不完整','請使用廠商聯繫窗口提供的完整連結，或重新掃描 QR Code。');}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    if(firebase.auth){
      try{ await firebase.auth().signInAnonymously(); }
      catch(authErr){ console.warn('匿名登入失敗：',authErr.message); }
    }
    db=firebase.database();
    const snap=await db.ref('zeju_data/projects').once('value');
    const projects=toArr(snap.val());
    project=projects.find(p=>p&&p.vendorToken===token);
    if(!project){return showError('找不到案場資料','此連結可能已失效，請聯繫窗口確認。');}
    render();
  }catch(err){
    console.error(err);
    showError('載入失敗','網路連線出現問題，請稍後再試一次。');
  }
}

function render(){
  document.getElementById('app').innerHTML=`
    <div class="top">
      <div class="wrap">
        <div class="brand">廠商進度回報</div>
        <div class="pj-name">${esc(project.name||'案場')}</div>
        <div class="pj-meta">${esc(project.address||'')}</div>
      </div>
    </div>
    <div class="wrap">
      <div class="card">
        <div class="card-t">📷 新增回報</div>
        <div class="field">
          <label class="fl">廠商／回報人姓名</label>
          <input class="fi" id="vrName" placeholder="例：秉策工程行 陳先生">
        </div>
        <div class="field">
          <label class="fl">工程類別</label>
          <select class="fi" id="vrCat">
            ${CATS.map(c=>'<option>'+esc(c)+'</option>').join('')}
          </select>
        </div>
        <div class="field">
          <label class="fl">說明（選填）</label>
          <textarea class="fi" id="vrNote" placeholder="例：今天完成主臥泥作打底"></textarea>
        </div>
        <div class="upz" id="vrZone">
          <div class="ic">📷</div>
          <div class="t">拍照上傳（可多張）</div>
          <div class="s">拍現場照片就好，不用打字說明太多</div>
        </div>
        <input type="file" id="vrFile" accept="image/*" capture="environment" multiple style="display:none">
        <div class="pgrid" id="vrGrid"></div>
        <button class="btn-main" id="vrSubmit" disabled>📤 送出回報</button>
      </div>
      <div class="foot">本頁面由「案場通」系統提供，僅用於回報施工進度照片</div>
    </div>
  `;

  const zone=document.getElementById('vrZone');
  const file=document.getElementById('vrFile');
  const grid=document.getElementById('vrGrid');
  const submitBtn=document.getElementById('vrSubmit');

  zone.addEventListener('click',()=>file.click());

  file.addEventListener('change',async e=>{
    const files=Array.from(e.target.files);if(!files.length)return;e.target.value='';
    zone.querySelector('.t').textContent='處理照片中…';
    for(const f of files){
      const compressed=await compressImage(f,1400,.72);
      if(compressed)photos.push(compressed);
    }
    zone.querySelector('.t').textContent='拍照上傳（可多張）';
    renderPhotoGrid();
  });

  function renderPhotoGrid(){
    grid.innerHTML=photos.map((p,i)=>
      '<div class="ph"><img src="'+p+'"><button class="del" data-i="'+i+'">✕</button></div>'
    ).join('')+'<div class="add" id="vrAddMore">＋</div>';
    grid.querySelectorAll('.del').forEach(b=>{
      b.addEventListener('click',()=>{photos.splice(parseInt(b.dataset.i),1);renderPhotoGrid();});
    });
    document.getElementById('vrAddMore')?.addEventListener('click',()=>file.click());
    submitBtn.disabled=photos.length===0;
  }

  submitBtn.addEventListener('click',async ()=>{
    const name=(document.getElementById('vrName').value||'').trim();
    if(!name){showToast('請填入廠商或回報人姓名');return;}
    if(!photos.length){showToast('請至少上傳一張照片');return;}
    submitBtn.disabled=true;submitBtn.textContent='送出中…';
    try{
      const id=Date.now();
      await db.ref('zeju_data/vendor_reports/'+id).set({
        _id:id,
        projectId:project._id,
        vendorName:name,
        cat:document.getElementById('vrCat').value,
        note:(document.getElementById('vrNote').value||'').trim(),
        photos:photos.map(url=>({url})),
        _ts:new Date().toLocaleString('zh-TW'),
      });
      showDone();
    }catch(err){
      console.error(err);
      showToast('送出失敗，請檢查網路連線後再試一次');
      submitBtn.disabled=false;submitBtn.textContent='📤 送出回報';
    }
  });
}

function showDone(){
  document.getElementById('app').innerHTML=`
    <div class="wrap">
      <div class="state">
        <div class="ico">✅</div>
        <h2>回報已送出！</h2>
        <p>${esc(project.name||'')} 的進度照片已經送到系統，感謝配合。</p>
        <button class="btn-main" style="margin-top:20px" onclick="resetForm()">📷 再回報一筆</button>
      </div>
    </div>
  `;
}

function resetForm(){ photos=[]; render(); }

load();
</script>
</body>
</html>
