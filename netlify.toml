[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/AGENTS.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/CODEX_HANDOFF.md"
  to = "/"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "POST, OPTIONS"
